[colors]
background = #282828
background-alt = #1d2021
foreground = #EBDBB2
primary = #D79921

green = #B8BB26
green-alt = #98971A
cyan = #8EC07C
blue = #83A598
red = #FB4934

secondary = #458588
alert = #CC241D
disabled = #928374

[bar/corvos]
monitor = DP-0
width = 100%
height = 19pt
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 3
padding-right = 3

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Noto Sans SemiCondensed=5;4
font-1 = corvos:size=23;8
font-2 = Cinnamon Weather:size=18;4
font-3 = monospace:size=14
font-4 = Noto Sans SemiCondensed:pixelsize=7;2

modules-left = corvos-menu xworkspaces xwindow
modules-center = polytime weather date
modules-right = xkeyboard cpu memory qredshift pulseaudio power-mode wired-network systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/secondary]
inherit = bar/corvos
monitor = DP-2

modules-left = xworkspaces
modules-center = time weather date
modules-right = notifications

enable-ipc = true

[module/time]
type = internal/date
interval = 1
time = %H:%M
label = %time%
label-foreground = ${colors.foreground}

[module/polytime]
type = custom/script
exec = ~/.local/bin/corvos/polytime
tail = true
format = <label>
label = %output%
label-foreground = ${colors.foreground}
click-left = ~/.local/bin/corvos/polytime toggle

[module/date]
type = custom/ipc
hook-0 = ~/.local/bin/corvos/polybar-date
initial = 1
format = <output>
click-left = ~/.local/bin/corvos/polybar-date toggle

[module/systray]
type = internal/tray
format = <tray>
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/wired-network]
type = custom/ipc
hook-0 = ~/.local/bin/corvos/polybar-net-status
initial = 1
format = <output>

[module/corvos-menu]
type = custom/menu

expand-right = true

label-open = %{T2}+
label-close = %{T2}+
label-separator = "  "
label-open-foreground = ${colors.cyan}
label-close-foreground = ${colors.cyan}

menu-0-0 = Settings
menu-0-0-exec = cinnamon-settings

[module/qredshift]
type = custom/ipc
hook-0 = ~/.local/bin/corvos/polybar-qredshift
initial = 1
format = <output>

format-prefix = "RED "
format-prefix-foreground = ${colors.red}

click-left = ~/.local/bin/corvos/polybar-qredshift toggle %pid%
scroll-up = ~/.local/bin/corvos/polybar-qredshift up %pid%
scroll-down = ~/.local/bin/corvos/polybar-qredshift down %pid%

[module/weather]
type = custom/script
exec = ~/.local/bin/corvos/polybar-weather
interval = 600

format = %{T3}<label>%{T-}
format-foreground = ${colors.foreground}

click-left = kitty --title "CorvOS Weather" ~/.local/bin/corvos/polybar-weather full

[settings]
screenchange-reload = true

[module/notifications]
type = custom/ipc

hook-0 = echo "%{F#8EC07C}●%{F-}"
hook-1 = echo "%{F#FB4934}●%{F-}"
hook-2 = echo "%{F#D79921}●%{F-}"

initial = 1
format = <output>

click-left = ~/.local/bin/corvos/dunst-polybar-indicator.sh review
click-middle = ~/.local/bin/corvos/dunst-polybar-indicator.sh mute-toggle
click-right = ~/.local/bin/corvos/dunst-polybar-indicator.sh clear

[module/power-mode]
type = custom/ipc
hook-0 = ~/.local/bin/corvos/power-mode status
initial = 1
format = <output>
click-left = ~/.local/bin/corvos/power-mode cycle && polybar-msg -p %pid% action power-mode hook 0
click-right = ~/.local/bin/corvos/power-mode cycle-back && polybar-msg -p %pid% action power-mode hook 0
